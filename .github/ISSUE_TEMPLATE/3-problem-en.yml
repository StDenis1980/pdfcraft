name: "Report a problem (English)"
description: "Something doesn't work in Tinta PDF (or another Tinta Office app)."
title: "[Problem] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. Don't attach documents with personal data (ID numbers, payslips, health data): if the problem only shows with such a file, describe it or prepare a copy without real data.
  - type: input
    id: version
    attributes:
      label: Version
      description: "Help › About Tinta PDF (for example, 0.14.0)."
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: ["Windows 11", "Windows 10", "macOS", "Linux", "Other"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: "The steps, one per line, so we can repeat them."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: "Screenshots or the error message help."
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: File (optional)
      description: "If it is a public form, link to where it can be downloaded."

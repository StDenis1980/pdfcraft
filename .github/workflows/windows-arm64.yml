# Windows on ARM (#61): package the ARM64 release the way release.yml does (cross-compiled on an
# x64 runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner and run it, and
# run the test suite natively on ARM64.
#
# Tinta Office: manual runs only. The upstream reusable workflow looks for the installed program in
# %ProgramFiles%\<app-dir>, and its app-dir input must be a single folder name, but Tinta PDF
# installs into %ProgramFiles%\Tinta Office\Tinta PDF (packaging/windows/pdfcraft.wxs), so its install
# check can't pass for this fork. It also checks out craft-i18n. Until the fork has its own ARM64
# install test, build the ARM64 MSI with `packaging/windows/package.ps1 -Arch arm64`;
# windows-msi.yml builds and checks the x64 installer.
name: Windows ARM64

on:
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@main
    with:
      app-name: pdfcraft
      app-dir: PdfCraft

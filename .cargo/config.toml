[alias]
xtask = "run -p xtask --"

# Tinta Office: this fork's builds are "Tinta PDF" (see crates/brand). The ArtCraft
# marks may not be used by redistributed builds (docs/brand/LICENSE-brand.txt).
[env]
PDFCRAFT_BRAND_NAME = "Tinta PDF"
PDFCRAFT_BRAND_SLUG = "tinta-pdf"
PDFCRAFT_BRAND_APP_ID = "io.github.stdenis1980.tintapdf"
PDFCRAFT_BRAND_PUBLISHER = "Tinta Office"
PDFCRAFT_BRAND_WEBSITE = "https://tintaoffice.com"
PDFCRAFT_BRAND_GITHUB = "https://github.com/StDenis1980/pdfcraft"
# Help and support: the site's contact section (email), and the fork's issue forms (es/uk/en).
PDFCRAFT_BRAND_SUPPORT = "https://tintaoffice.com/#contact"
PDFCRAFT_BRAND_REPORT = "https://github.com/StDenis1980/pdfcraft/issues/new/choose"
# Tinta Office: where error reports go once the person allowed them (apps/pdfcraft/src/tinta_report.rs).
TINTA_REPORT_URL = "https://report.tintaoffice.com"

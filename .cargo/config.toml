[alias]
xtask = "run -p xtask --"

# Tinta Office: this fork's builds are "Tinta PDF" (see crates/brand). The ArtCraft
# marks may not be used by redistributed builds (docs/brand/LICENSE-brand.txt).
[env]
PDFCRAFT_BRAND_NAME = "Tinta PDF"
PDFCRAFT_BRAND_SLUG = "tinta-pdf"
PDFCRAFT_BRAND_APP_ID = "io.github.stdenis1980.tintapdf"
PDFCRAFT_BRAND_PUBLISHER = "Tinta Office"
PDFCRAFT_BRAND_WEBSITE = "https://github.com/StDenis1980/pdfcraft"
PDFCRAFT_BRAND_GITHUB = "https://github.com/StDenis1980/pdfcraft"
